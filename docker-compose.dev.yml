# Dev stack: the package installed into ClimWeb, with hot code reloading.
# Needs a local `climweb_dev:latest` image (built from ../climweb) and a .env
# (see .env.sample). Admin: http://localhost:8010/admin
x-climweb-variables: &climweb-variables
  DATABASE_URL: postgis://${DB_USER:-climweb}:${DB_PASSWORD}@bulletin-db:5432/${DB_NAME:-climweb}
  REDIS_URL: redis://bulletin-redis:6379/0
  MIGRATE_ON_STARTUP: "true"
  ADMIN_URL_PATH: ${ADMIN_URL_PATH:-admin}
  # Until ClimWeb lists bulletin_studio in INSTALLED_APPS itself. Drop this line once
  # climweb_dev does, or Django refuses to start (app label registered twice).
  CLIMWEB_ADDITIONAL_APPS: bulletin_studio
  # ClimWeb forces 2FA on the admin (superusers included) by default; a dev
  # stack does without it.
  WAGTAIL_2FA_REQUIRED: "false"
  CLIMWEB_2FA_SUPERUSER_REQUIRED: "false"
  # Point at a running `npm run dev` in ../bulletin-studio-js to get HMR instead
  # of the vendored bundle. Resolved by the browser, so localhost is the host's.
  BULLETIN_STUDIO_DEV_SERVER: ${BULLETIN_STUDIO_DEV_SERVER:-}

services:
  bulletin-db:
    image: postgis/postgis:15-master
    environment:
      - POSTGRES_USER=${DB_USER:-climweb}
      - POSTGRES_DB=${DB_NAME:-climweb}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-?}
    volumes:
      - pgdata:/var/lib/postgresql/data

  bulletin-redis:
    image: redis:alpine

  climweb:
    image: climweb-bulletin-studio_dev
    build:
      context: .
      dockerfile: ./dev.Dockerfile
    ports:
      - "${BULLETIN_STUDIO_PORT:-8010}:8000"
    env_file:
      - .env
    environment:
      <<: *climweb-variables
      WAIT_HOSTS: bulletin-db:5432,bulletin-redis:6379
    depends_on:
      - bulletin-db
      - bulletin-redis
    volumes:
      - ./bulletin_studio:/app/bulletin_studio
      # Fixtures of the forecast map tests (outside the package, so they never ship).
      - ./dev:/app/dev:ro
      # static/bulletin_studio/app is a symlink to ../bulletin-studio-js/dist,
      # which resolves to /bulletin-studio-js/dist once inside the container.
      - ../bulletin-studio-js/dist:/bulletin-studio-js/dist:ro
      - static:/climweb/web/src/climweb/static
      - media:/climweb/web/src/climweb/media
    stdin_open: true
    tty: true

volumes:
  pgdata:
  static:
  media:
