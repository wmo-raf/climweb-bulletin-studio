[metadata]
name = climweb-bulletin-studio
version = 0.1.0a1
description = Block-based bulletin editor for WMO ClimWeb, backed by the Bulletin Studio JS app.
long_description = file:README.md
long_description_content_type = text/markdown
url = https://github.com/fgg-consultant/bulletin-studio-package
project_urls =
    Source = https://github.com/fgg-consultant/bulletin-studio-package
    Frontend = https://github.com/fgg-consultant/bulletin-studio-js
    Changelog = https://github.com/fgg-consultant/bulletin-studio-package/blob/main/CHANGELOG.md
author = FGG Consultant
license_expression = MIT
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 5.2
    Framework :: Wagtail
    Framework :: Wagtail :: 7
    Intended Audience :: Science/Research
    Operating System :: OS Independent
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: Implementation :: CPython
    Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Content Management System
    Topic :: Scientific/Engineering :: Atmospheric Science

[options]
packages = find_namespace:
include_package_data = true
# ClimWeb's own image runs Python 3.10.
python_requires = >=3.10
# ClimWeb itself is the real dependency (see README "Requirements") but is not on
# PyPI. The bounds below are the APIs we use, kept loose on purpose: ClimWeb pins
# Django and Wagtail, and a higher floor would make pip upgrade them under it.
install_requires =
    nh3>=0.2.11
    django>=4.2
    wagtail>=6.3

# find_namespace, not find: templates/ and static/ hold no __init__.py but ship
# inside the package, and setuptools warns about data dirs it was not told about.
[options.packages.find]
include =
    bulletin_studio
    bulletin_studio.*
